<div class="section">
  <div class="container">
    <div class="row full-height justify-content-center">
      <div class="col-12 text-center align-self-center py-5">
        <div class="section pb-5 pt-5 pt-sm-2 text-center">
          <h6 class="mb-0 pb-3"><span>Iniciar </span><span>Registrarse</span></h6>
          <input class="checkbox" type="checkbox" id="reg-log" name="reg-log" />
          <label for="reg-log"></label>

          <div class="card-3d-wrap mx-auto">
            <div class="card-3d-wrapper">

              <!-- LOGIN -->
              <div class="card-front">
                <div class="center-wrap">
                  <div class="section text-center">
                    <h4 class="mb-4 pb-3">Iniciar Sesión</h4>

                    <div class="form-group">
                      <input type="email" class="form-style" placeholder="Email" autocomplete="off">
                      <i class="input-icon uil uil-at"></i>
                    </div>

                    <div class="form-group mt-2">
                      <input type="password" class="form-style" placeholder="Contraseña" autocomplete="off">
                      <i class="input-icon uil uil-lock-alt"></i>
                    </div>

                    <a (click)="irPagina3()" class="btn mt-4">Iniciar</a>
                    <p class="mb-0 mt-4 text-center"><a href="#" class="link">¿Olvidaste tu contraseña?</a></p>
                  </div>
                </div>
              </div>

              <!-- REGISTRO -->
              <div class="card-back">
                <div class="center-wrap">
                  <div class="section text-center">
                    <h4 class="mb-4 pb-3">Registrarse</h4>

                    <div class="form-group">
                      <input type="text" class="form-style" placeholder="Nombres" [(ngModel)]="nuevoUsuario.nombre">
                      <i class="input-icon uil uil-user"></i>
                    </div>

                    <div class="form-group">
                      <input type="text" class="form-style" placeholder="Apellidos" [(ngModel)]="nuevoUsuario.apellido">
                      <i class="input-icon uil uil-user"></i>
                    </div>

                    <div class="form-group">
                      <input type="text" class="form-style" placeholder="DNI" [(ngModel)]="nuevoUsuario.dni">
                      <i class="input-icon uil uil-id-card"></i>
                    </div>

                    <div class="form-group">
                      <input type="text" class="form-style" placeholder="Celular" [(ngModel)]="nuevoUsuario.celular">
                      <i class="input-icon uil uil-phone"></i>
                    </div>

                    <div class="form-group mt-2">
                      <input type="text" class="form-style" placeholder="Usuario" [(ngModel)]="nuevoUsuario.usuario">
                      <i class="input-icon uil uil-user-circle"></i>
                    </div>

                    <div class="form-group mt-2">
                      <input type="password" class="form-style" placeholder="Contraseña" [(ngModel)]="nuevoUsuario.contrasena">
                      <i class="input-icon uil uil-lock-alt"></i>
                    </div>

                    <a (click)="registrarUsuario()" class="btn mt-4">Registrarse</a>

                  </div>
                </div>
              </div>
              <!-- FIN REGISTRO -->

            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
