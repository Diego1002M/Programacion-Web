<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-9">
      <div class="card text-center justify-content-center shadow-lg card-1 border-0 px-sm-2">
        <div class="card-body show">
          <div class="row">
            <div class="col">
              <h5><b>Seleccione una alerta</b></h5>
              <p>¿Qué tipo de emergencia desea reportar?</p>
            </div>
          </div>

          <div class="radio-group row justify-content-center px-3 text-center">
            <div
              *ngFor="let opcion of opciones; let i = index"
              class="col-auto mx-2 card-block py-0 text-center radio"
              [ngClass]="{ selected: opcionSeleccionada === i }"
              (click)="seleccionarOpcion(i)"
            >
              <div class="pic">
                <img [src]="opcion.img" width="100" height="100" alt="icono">
              </div>
              <p>{{ opcion.texto }}</p>
            </div>
          </div>
            
            <div class="row justify-content-between mt-4">
                <div class="col-auto">
                  <button class="btn-custom" (click)="iratras()">
                    atras
                  </button>
                </div>

                <div class="col-auto">
                  <button class="btn-custom" (click)="enviarAlerta()">
                    Confirmar <i class="fa fa-angle-right ml-2"></i>
                  </button>
                </div>
            </div>

        </div>
      </div>
    </div>
  </div>
</div>
