<div id="wrapper" [class.toggled]="isToggled">
  <div class="overlay" [style.display]="isClosed ? 'none' : 'block'"></div>

  <!-- Sidebar -->
  <nav class="navbar navbar-inverse fixed-top" id="sidebar-wrapper" role="navigation">
    <ul class="nav sidebar-nav">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <a href="#">MENÚ</a>
        </div>
      </div>
      <li><a routerLink="/inicio">Inicio</a></li>
      <li><a routerLink="/siguiente">Inicio de sesión/ Registrate</a></li>
      <li><a routerLink="/pagina2">Alerta</a></li>
      <li><a routerLink="/pagina3">Registrar alerta</a></li>
      <li><a routerLink="/pagina4">Registro de alertas</a></li>
      <li class="dropdown">
      </li>
    </ul>
  </nav>

  <!-- Page Content -->
  <div id="page-content-wrapper">
    <button
      type="button"
      class="hamburger animated fadeInLeft"
      [ngClass]="{ 'is-closed': isClosed, 'is-open': !isClosed }"
      (click)="toggleMenu(); toggleSidebar()"
    >
      <span class="hamb-top"></span>
      <span class="hamb-middle"></span>
      <span class="hamb-bottom"></span>
    </button>

    <div class="container">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
