<div class="contenedor">

  <h2 class="titulo">📋Registro de Alertas</h2>

  <table class="tabla">
    <thead>
      <tr>
        <th>ID</th>
        <th>Tipo de Alerta</th>
        <th>Fecha</th>
        <th>Hora</th>
        <th>Ubicación</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let a of alertas">
        <td>{{ a.id }}</td>
        <td>{{ a.tipo }}</td>
        <td>{{ a.fecha }}</td>
        <td>{{ a.hora }}</td>
        <td>{{ a.ubicacion }}</td>
      </tr>
    </tbody>
  </table>

</div>
